<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{
    background:#0C1513;
    color:#E3E9E4;
    font-family:"Source Serif 4",Georgia,serif;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:64px 72px;
    position:relative;
  }
  .glow{
    position:absolute;
    right:-180px;top:-180px;
    width:620px;height:620px;
    border-radius:50%;
    background:radial-gradient(circle,#54C2A622 0%,#54C2A600 70%);
  }
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;
    font-size:17px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:#54C2A6;
  }
  h1{
    font-family:Archivo,sans-serif;
    font-variation-settings:"wdth" 112;
    font-weight:700;
    font-size:92px;
    line-height:.98;
    letter-spacing:-.025em;
    margin-top:18px;
  }
  .role{
    font-family:Archivo,sans-serif;
    font-variation-settings:"wdth" 106;
    font-weight:500;
    font-size:26px;
    color:#8FA39B;
    margin-top:18px;
  }
  .role b{color:#E3E9E4;font-weight:600;}
  .icons{display:flex;gap:16px;margin-top:6px;}
  .icons img{
    width:76px;height:76px;
    border-radius:19px;
    object-fit:cover;
    box-shadow:0 0 0 1px #ffffff1a, 0 10px 24px #00000055;
  }
  .foot{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:40px;
  }
  .stats{display:flex;gap:54px;}
  .stat b{
    display:block;
    font-family:Archivo,sans-serif;
    font-weight:700;
    font-size:40px;
    letter-spacing:-.02em;
    color:#E3E9E4;
    line-height:1.1;
  }
  .stat span{
    font-family:"IBM Plex Mono",monospace;
    font-size:13px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#8FA39B;
  }
  .url{
    font-family:"IBM Plex Mono",monospace;
    font-size:16px;
    letter-spacing:.06em;
    color:#54C2A6;
    padding-bottom:6px;
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <div>
    <p class="eyebrow">Portfolio</p>
    <h1>Ilkhom<br />Shergoziyev</h1>
    <p class="role">Senior Android &amp; Flutter Developer &nbsp;·&nbsp; <b>Android Team Lead</b></p>
  </div>

  <div class="icons">
    <img src="assets/myuztelecom-icon.png" alt="" />
    <img src="assets/oneid-icon.png" alt="" />
    <img src="assets/joymee-icon.png" alt="" />
    <img src="assets/hamroh-icon.png" alt="" />
    <img src="assets/myuzbekistan-icon.png" alt="" />
    <img src="assets/mediabox-icon.png" alt="" />
    <img src="assets/telecomcar-icon.png" alt="" />
    <img src="assets/tsofthrm-icon.png" alt="" />
  </div>

  <div class="foot">
    <div class="stats">
      <div class="stat"><b>3.5M+</b><span>monthly active users</span></div>
      <div class="stat"><b>10</b><span>shipped apps</span></div>
      <div class="stat"><b>7+</b><span>years</span></div>
    </div>
    <span class="url">ilhomsh.github.io/Portfolio</span>
  </div>
</body>
</html>
